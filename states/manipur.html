<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipur/title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="#"><img src="food images\logo.png" class="logo"></a>
            <div class="desktop">
                <a href="#" class="cart-icon">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-value">0</span>
                </a>

                <a href="#" class="button signin-btn">
                    Sign In
                    &nbsp;
                    <i class="fa-solid fa-arrow-right"></i>
                </a>

                <a href="#" class="bars">
                    <i class="fa-solid fa-bars"></i>
                </a>
            </div>

            <div class="cart-modal" id="cartModal">
                <div class="cart-box">
                    <h2>Your Cart</h2>
                    <div id="cartItems"></div>
                    <h3 id="cartTotal">Total: ₹ 0</h3>
                    <button id="closeCart">Close</button>
                </div>
            </div>

            <div class="login-container" id="loginContainer">
                <div class="login-box">
                    <h2>Sign In</h2>
                    <input type="text" id="username" placeholder="Enter Username">
                    <input type="password" id="password" placeholder="Enter Password">
                    <div class="login-buttons">
                        <button id="loginBtn">Login</button>
                        <button id="closeLogin">Cancel</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

<section>
        <div class="wrapper top">

            <div class="text-center p-bottom">
                <h3 class="menu">MANIPUR</h3>
                <h2 class="menu-famous"> DISHES</h2>
            </div>

            <div class="card-list">

                <div class="order-card">
                    <div class="card-image">
                        <img src="Dishes\Bhakri Andhra.png" alt="">
                    </div>
                    <h4>BHAKRI</h4>
                    <h4>₹ 70</h4>
                    <a href="#" class="button">Add to Cart</a>
                </div>


                <div class="order-card">
                    <div class="card-image">
                        <img src="Dishes\Payasam Andhara.png" alt="">
                    </div>
                    <h4>Payasam</h4>
                    <h4>₹ 80</h4>
                    <a href="#" class="button">Add to Cart</a>
                </div>


                <div class="order-card">
                    <div class="card-image">
                        <img src="Dishes\Mirchi Salan Andhra.png" alt="">
                    </div>
                    <h4>MIRCHI SALAN</h4>
                    <h4>₹ 100</h4>
                    <a href="#" class="button">Add to Cart</a>
                </div>

                <div class="order-card">
                    <div class="card-image">
                        <img src="Dishes\Pootharekulu Andhra.png" alt="">
                    </div>
                    <h4>POOTHAREKULU</h4>
                    <h4>₹ 90</h4>
                    <a href="#" class="button">Add to Cart</a>
                </div>

                <div class="order-card">
                    <div class="card-image">
                        <img src="Dishes\Pot Biryani Andhra.png" alt="">
                    </div>
                    <h4>POT BIRYANI</h4>
                    <h4>₹ 250</h4>
                    <a href="#" class="button">Add to Cart</a>
                </div>

                <div class="order-card">
                    <div class="card-image">
                        <img src="Dishes\Rava Kesari Andhra.png" alt="">
                    </div>
                    <h4>RAVA KESARI</h4>
                    <h4>₹ 150</h4>
                    <a href="#" class="button">Add to Cart</a>

                </div>
                <div class="order-card">
                    <div class="card-image">
                        <img src="Dishes\Madatha Kaja Andhra.png" alt="">
                    </div>
                    <h4>MADATHA KAJA</h4>
                    <h4>₹ 70</h4>
                    <a href="#" class="button">Add to Cart</a>
                </div>

                <div class="order-card">
                    <div class="card-image">
                        <img src="Dishes\Mirchi Bhaji Andhra.png" alt="">
                    </div>
                    <h4>MIRCHI BHAJI</h4>
                    <h4>₹ 80</h4>
                    <a href="#" class="button">Add to Cart</a>
                </div>
                
    </section>

</body>
<script src="script.js"></script>
</html>
